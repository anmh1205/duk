target-version = "py310"
line-length = 88

[lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]

[lint.isort]
known-first-party = ["duk_core", "duk_description"]

[lint.per-file-ignores]
# Optional scientific dependencies are checked with pytest.importorskip first.
"robot/software/core/tests/test_*.py" = ["E402"]
