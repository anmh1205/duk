[build-system]
requires = ["setuptools>=77,<80", "wheel>=0.45,<1"]
build-backend = "setuptools.build_meta"

[project]
name = "duk-core"
version = "0.1.0"
description = "DUK robotics modeling, control and visualization foundations"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8,<9"]
research = [
  # Keep the NumPy 1.x ABI while ROS apt binary extensions may still target it.
  "numpy>=1.26,<2",
  "scipy>=1.11,<2",
  "sympy>=1.12,<2",
  "matplotlib>=3.8,<4",
  "jupyterlab>=4,<5",
  "ipywidgets>=8,<9"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
