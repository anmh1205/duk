[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "duk-core"
version = "0.1.0"
description = "DUK robotics modeling, control and visualization foundations"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8,<10"]
research = [
  "numpy>=1.26",
  "scipy>=1.11",
  "sympy>=1.12",
  "matplotlib>=3.8",
  "jupyterlab>=4",
  "ipywidgets>=8"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
