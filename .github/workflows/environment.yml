name: Development environment

on:
  push:
    branches:
      - main
    paths:
      - ".devcontainer/**"
      - ".dockerignore"
      - ".env.example"
      - "compose.yaml"
      - "environment/docker/**"
      - "environment/platforms/**"
      - "robot/config/physical/**"
      - "robot/software/core/pyproject.toml"
      - "robot/software/core/src/**"
      - "robot/software/core/examples/**"
      - "robot/software/core/tests/**"
      - "robot/software/ros2_ws/src/**"
      - "tools/environment-check/**"
      - ".github/workflows/environment.yml"
  pull_request:
    paths:
      - ".devcontainer/**"
      - ".dockerignore"
      - ".env.example"
      - "compose.yaml"
      - "environment/docker/**"
      - "environment/platforms/**"
      - "robot/config/physical/**"
      - "robot/software/core/pyproject.toml"
      - "robot/software/core/src/**"
      - "robot/software/core/examples/**"
      - "robot/software/core/tests/**"
      - "robot/software/ros2_ws/src/**"
      - "tools/environment-check/**"
      - ".github/workflows/environment.yml"
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

concurrency:
  group: development-environment-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  static:
    name: Static environment configuration
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Validate shell syntax
        run: |
          bash -n environment/docker/ros/dev-start.sh
          bash -n tools/environment-check/verify-dev-container.sh

      - name: Validate Dev Container JSON
        run: python3 -m json.tool .devcontainer/devcontainer.json >/dev/null

  compose:
    needs: static
    name: ROS 2 ${{ matrix.ros_distro }} / linux-${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - ros_distro: jazzy
            arch: amd64
            runner: ubuntu-24.04
          - ros_distro: humble
            arch: amd64
            runner: ubuntu-24.04
          - ros_distro: jazzy
            arch: arm64
            runner: ubuntu-24.04-arm
          - ros_distro: humble
            arch: arm64
            runner: ubuntu-24.04-arm
    env:
      ROS_DISTRO: ${{ matrix.ros_distro }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Match container developer identity to runner
        run: |
          echo "DEV_UID=$(id -u)" >> "$GITHUB_ENV"
          echo "DEV_GID=$(id -g)" >> "$GITHUB_ENV"

      - name: Validate resolved Compose configuration
        run: docker compose config --quiet

      - name: Build development image
        run: docker compose build dev

      - name: Start development service and wait for health
        run: docker compose up -d --wait dev

      - name: Verify tools, Python stack, model example and tests
        run: |
          docker compose exec -T dev \
            bash tools/environment-check/verify-dev-container.sh --full

      - name: Show Compose state on failure
        if: failure()
        run: |
          docker compose ps
          docker compose logs --no-color dev

      - name: Tear down
        if: always()
        run: docker compose down --volumes --remove-orphans

  devcontainer:
    name: Dev Container lifecycle / Jazzy / linux-amd64
    needs: compose
    runs-on: ubuntu-24.04
    env:
      ROS_DISTRO: jazzy

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Match container developer identity to runner
        run: |
          echo "DEV_UID=$(id -u)" >> "$GITHUB_ENV"
          echo "DEV_GID=$(id -g)" >> "$GITHUB_ENV"

      - name: Show Docker toolchain versions
        run: |
          docker version
          docker compose version
          docker buildx version

      - name: Apply Buildx workaround only for affected Compose versions
        run: |
          python3 - <<'PY'
          import os
          import re
          import subprocess

          raw = subprocess.check_output(
              ["docker", "compose", "version", "--short"],
              text=True,
          ).strip()
          match = re.search(r"(\d+)\.(\d+)\.(\d+)", raw)
          if match is None:
              raise SystemExit(f"cannot parse Docker Compose version: {raw!r}")

          version = tuple(int(part) for part in match.groups())
          fixed = (5, 7, 0)

          if version < fixed:
              with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env_file:
                  env_file.write("BUILDX_BAKE_ENTITLEMENTS_FS=0\n")
              print(
                  f"Docker Compose {raw} predates the 5.7.0 fs.read fix; "
                  "enabling the CI-only compatibility workaround."
              )
          else:
              print(
                  f"Docker Compose {raw} contains the fs.read fix; "
                  "no Buildx entitlement workaround is enabled."
              )
          PY

      - name: Install Dev Container CLI
        run: npm install --global @devcontainers/cli@0.90.0

      - name: Show Dev Container CLI version
        run: devcontainer --version

      - name: Create Dev Container
        run: devcontainer up --workspace-folder .

      - name: Run Dev Container lifecycle commands
        run: devcontainer run-user-commands --workspace-folder .

      - name: Verify Dev Container runtime
        run: |
          devcontainer exec --workspace-folder . \
            bash tools/environment-check/verify-dev-container.sh --full

      - name: Tear down
        if: always()
        run: docker compose down --volumes --remove-orphans

  ubuntu-next:
    name: Host Ubuntu 26.04 / Jazzy / linux-amd64
    needs: compose
    runs-on: ubuntu-26.04
    env:
      ROS_DISTRO: jazzy

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Match container developer identity to runner
        run: |
          echo "DEV_UID=$(id -u)" >> "$GITHUB_ENV"
          echo "DEV_GID=$(id -g)" >> "$GITHUB_ENV"

      - name: Build and start on Ubuntu 26.04 host
        run: docker compose up -d --build --wait dev

      - name: Verify runtime on Ubuntu 26.04 host
        run: |
          docker compose exec -T dev \
            bash tools/environment-check/verify-dev-container.sh --full

      - name: Tear down
        if: always()
        run: docker compose down --volumes --remove-orphans
