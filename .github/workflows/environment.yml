name: Development environment

on:
  push:
    paths:
      - ".devcontainer/**"
      - ".dockerignore"
      - ".env.example"
      - "compose.yaml"
      - "environment/docker/**"
      - "environment/platforms/**"
      - "robot/software/core/pyproject.toml"
      - "robot/software/core/src/**"
      - "robot/software/core/examples/**"
      - "robot/software/core/tests/**"
      - "tools/environment-check/**"
      - ".github/workflows/environment.yml"
  pull_request:
    paths:
      - ".devcontainer/**"
      - ".dockerignore"
      - ".env.example"
      - "compose.yaml"
      - "environment/docker/**"
      - "environment/platforms/**"
      - "robot/software/core/pyproject.toml"
      - "robot/software/core/src/**"
      - "robot/software/core/examples/**"
      - "robot/software/core/tests/**"
      - "tools/environment-check/**"
      - ".github/workflows/environment.yml"

permissions:
  contents: read

jobs:
  compose:
    name: ROS 2 ${{ matrix.ros_distro }} / linux-amd64
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        ros_distro:
          - jazzy
          - humble
    env:
      ROS_DISTRO: ${{ matrix.ros_distro }}
      DEV_UID: "1000"
      DEV_GID: "1000"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate resolved Compose configuration
        run: docker compose config --quiet

      - name: Build development image
        run: docker compose build dev

      - name: Start development service and wait for health
        run: docker compose up -d --wait dev

      - name: Verify tools, Python stack, model example and tests
        run: |
          docker compose exec -T dev             bash tools/environment-check/verify-dev-container.sh --full

      - name: Show Compose state on failure
        if: failure()
        run: |
          docker compose ps
          docker compose logs --no-color dev

      - name: Tear down
        if: always()
        run: docker compose down --volumes --remove-orphans
