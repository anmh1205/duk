name: Python core

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install core and test dependencies
        run: python -m pip install -e "./robot/software/core[test]"
      - name: Run unit tests
        run: python -m pytest -q robot/software/core/tests
      - name: Run standalone example
        run: python robot/software/core/examples/planar_chain.py
      - name: Compile Python sources
        run: python -m compileall -q robot/software/core/src
