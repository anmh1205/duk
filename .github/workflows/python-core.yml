name: Python core

on:
  push:
    branches:
      - main
    paths:
      - "robot/config/physical/**"
      - "robot/simulation/scenarios/**"
      - "research/experiments/duk-v3/**"
      - "applications/operator-dashboard/**"
      - "tests/integration/**"
      - "robot/software/core/**"
      - "robot/software/ros2_ws/src/**"
      - "tools/**"
      - "ruff.toml"
      - "pytest.ini"
      - ".github/workflows/python-core.yml"
  pull_request:
    paths:
      - "robot/config/physical/**"
      - "robot/simulation/scenarios/**"
      - "research/experiments/duk-v3/**"
      - "applications/operator-dashboard/**"
      - "tests/integration/**"
      - "robot/software/core/**"
      - "robot/software/ros2_ws/src/**"
      - "tools/**"
      - "ruff.toml"
      - "pytest.ini"
      - ".github/workflows/python-core.yml"
  workflow_dispatch:

concurrency:
  group: python-core-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  core:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: robot/software/core/pyproject.toml
      - name: Install core, research and quality dependencies
        run: python -m pip install -e "./robot/software/core[test,research,dev]"
      - name: Check Python and notebook style
        run: |
          ruff check .
          ruff format --check .
      - name: Test core, dashboard, geometry adapters and development tools
        env:
          OPENBLAS_NUM_THREADS: "1"
        run: python -m pytest -q -m "not ros"
      - name: Run DUK leg-kinematics example
        run: python robot/software/core/examples/duk_leg_kinematics.py --angle-deg 75
      - name: Inspect unidentified symbolic biped model
        run: python robot/software/core/examples/duk_planar_model.py
      - name: Compile Python sources
        run: python -m compileall -q robot/software/core/src
      - name: Execute DUK v3 notebooks in fresh kernels
        env:
          OPENBLAS_NUM_THREADS: "1"
        run: python robot/software/core/examples/run_duk_notebooks.py
