name: Python core

on:
  push:
    paths:
      - "robot/config/physical/**"
      - "robot/software/core/**"
      - ".github/workflows/python-core.yml"
  pull_request:
    paths:
      - "robot/config/physical/**"
      - "robot/software/core/**"
      - ".github/workflows/python-core.yml"

concurrency:
  group: python-core-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  core:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: robot/software/core/pyproject.toml
      - name: Install core and test dependencies
        run: python -m pip install -e "./robot/software/core[test]"
      - name: Run unit tests
        run: python -m pytest -q robot/software/core/tests
      - name: Run DUK leg-kinematics example
        run: python robot/software/core/examples/duk_leg_kinematics.py --angle-deg 75 --branch 1
      - name: Compile Python sources
        run: python -m compileall -q robot/software/core/src
