name: duk-${ROS_DISTRO:-jazzy}

services:
  dev:
    build:
      context: .
      dockerfile: environment/docker/ros/Dockerfile
      args:
        ROS_DISTRO: ${ROS_DISTRO:-jazzy}
        DEV_UID: ${DEV_UID:-1000}
        DEV_GID: ${DEV_GID:-1000}
    working_dir: /workspace
    volumes:
      - .:/workspace
      - ros-build:/workspace/robot/software/ros2_ws/build
      - ros-install:/workspace/robot/software/ros2_ws/install
      - ros-log:/workspace/robot/software/ros2_ws/log
    stdin_open: true
    tty: true
    init: true
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "bash /workspace/tools/environment-check/verify-dev-container.sh --quick >/dev/null 2>&1",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    command: ["sleep", "infinity"]

volumes:
  ros-build:
  ros-install:
  ros-log:
