[pytest]
testpaths =
    robot/software/core/tests
    robot/software/ros2_ws/src/duk_description/test
    tools/dev/test
    tests/integration
pythonpath =
    robot/software/core/src
    robot/software/ros2_ws/src/duk_description
    applications/operator-dashboard
markers =
    ros: requires the ROS and Qt runtime in the simulation environment
addopts = --strict-markers
